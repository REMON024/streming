services:
  backend:
    build:
      target: development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./apps/backend:/src
    command: dotnet watch run --project src/StreamingPlatform.API

  streaming:
    volumes:
      - ./apps/streaming:/app
    environment:
      ENV: development

  frontend:
    build:
      target: development
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    command: pnpm dev
